apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: user2
  name: user2-full-access
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "deployments", "services", "replicasets", "jobs", "configmaps", "secrets", "persistentvolumeclaims", "pods/log", "pods/exec"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user2-binding
  namespace: user2
subjects:
- kind: User
  name: user2@cloudlab.internal
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: user2-full-access
  apiGroup: rbac.authorization.k8s.io
