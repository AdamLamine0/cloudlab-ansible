[nomad_test]
# The brand-new, disposable Debian 13 VM — install the base OS manually first,
# then point Ansible at it. This is the VM's CURRENT (DHCP) address — the
# playbook itself is what moves it to the static 192.168.1.60 defined in
# roles/nomad_node/defaults/main.yml, so don't change this line to .60 yet.
test-nomad ansible_host=192.168.1.60 ansible_user=root ansible_password="{{ vault_vm_password }}"

# --- DO NOT UNCOMMENT until the playbook has been proven clean against the
# --- test VM above. This group targets the real, currently-working nomad VM.
# [nomad_prod]
# nomad ansible_host=192.168.1.51 ansible_user=root ansible_password="{{ vault_vm_password }}"

[nomad_test:vars]
# Password auth through a password-protected jump host needs sshpass wrapping
# BOTH hops: the outer connection (ansible_password above, handled by
# Ansible itself) and the ProxyCommand's own inner ssh to the Proxmox host
# (handled manually here, since Ansible doesn't touch ProxyCommand's auth).
ansible_ssh_common_args='-o ProxyCommand="sshpass -p "{{ vault_jump_password }}" ssh -o StrictHostKeyChecking=no -W %h:%p root@192.168.64.172"'

[kube_test]
# A second brand-new, disposable Debian 13 VM — separate from test-nomad.
# Same rules apply: this is the VM's CURRENT (DHCP) address until the
# playbook moves it to the static IP in roles/kube_node/defaults/main.yml.
test-kube ansible_host=192.168.1.70 ansible_user=root ansible_password="{{ vault_vm_password }}"

# --- DO NOT UNCOMMENT until proven clean. Real, currently-working kube VM,
# --- running live tenant workloads, Dex, Vault, and monitoring.
# [kube_prod]
# kube ansible_host=192.168.1.50 ansible_user=root ansible_password="{{ vault_vm_password }}"

[kube_test:vars]
ansible_ssh_common_args='-o ProxyCommand="sshpass -p "{{ vault_jump_password }}" ssh -o StrictHostKeyChecking=no -W %h:%p root@192.168.64.172"'
