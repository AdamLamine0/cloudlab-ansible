<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudLab — nothing deployed yet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <div class="bg">
    <img class="bg__img" src="assets/bg-aurora.png" alt="" aria-hidden="true">
    <div class="bg__scrim"></div>
    <div class="bg__glow"></div>
  </div>

  <nav class="rail" aria-label="Primary">
    <img class="rail__logo" src="assets/tt-mark.png" alt="Tunisie Telecom">
    <a class="rail__item rail__item--active" href="dashboard-empty.html" aria-label="Overview" aria-current="page">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
    </a>
    <a class="rail__item" href="dashboard.html" aria-label="Projects">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="4" r="2.2"/><circle cx="4" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><path d="M8 6.2 L4 9.8 M8 6.2 L12 9.8"/></svg>
    </a>
    <span class="rail__spacer"></span>
    <span class="rail__avatar" aria-hidden="true">AB</span>
  </nav>

  <main class="app">

    <header class="topbar">
      <div>
        <p class="kicker">Your space</p>
        <h1 class="greeting">Bonjour, Amine.</h1>
      </div>
      <div class="topbar__actions">
        <a class="link-quiet" href="login.html">Log out</a>
      </div>
    </header>

    <section class="empty">
      <div class="empty__card">
        <svg class="empty__diagram" width="180" height="70" viewBox="0 0 180 70" aria-hidden="true">
          <g stroke="rgba(255,255,255,.45)" fill="none" stroke-width="1.2">
            <path d="M20 35 H62 M90 35 H118 M146 35 H162"/>
          </g>
          <circle cx="20" cy="35" r="9" fill="none" stroke="rgba(255,255,255,.55)"/>
          <rect x="62" y="21" width="28" height="28" rx="8" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.5)"/>
          <rect x="118" y="21" width="28" height="28" rx="8" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.4)"/>
          <circle cx="168" cy="35" r="6" fill="#48e3b0"/>
        </svg>
        <h2 class="empty__title">Nothing deployed yet</h2>
        <p class="empty__body">Tell CloudLab what you want to build — a site, an API, a small service. It picks the infrastructure and hands you back a live address.</p>
        <a class="btn" href="dashboard.html">Launch your first project</a>
      </div>
    </section>

    <div class="footnotes">
      <p class="badge"><span class="badge__dot"></span>Takes about 4 minutes</p>
      <p class="badge"><span class="badge__dot"></span>Your own isolated space</p>
    </div>

  </main>
</div>
</body>
</html>
